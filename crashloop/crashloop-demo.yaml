apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
  namespace: default
  labels:
    app.kubernetes.io/name: crashloop-demo
    app.kubernetes.io/part-of: k8s-monitoring-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crashloop-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crashloop-demo
        app.kubernetes.io/part-of: k8s-monitoring-test
    spec:
      restartPolicy: Always
      containers:
        - name: will-crash
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          # Exit with non-zero after a short sleep to force CrashLoopBackOff
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "starting and about to fail...";
              sleep 1;
              exit 1
          # Small resource requests to avoid scheduling issues
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          # Optional: this probe will also contribute to restarts if the pod lingers
          livenessProbe:
            exec:
              command: ["/bin/false"]
            initialDelaySeconds: 2
            periodSeconds: 5
